name: Bug or layout problem
description: A broken link, something that looks wrong, or doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and on which page?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
