name: Translation fix
description: Something reads wrong, or is missing, in one of the site's languages
labels: ["translation"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, Español, Português, Français, Deutsch, हिन्दी, 日本語, Other / new language]
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text, and why
    validations:
      required: true
